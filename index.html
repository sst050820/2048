:root {
  --abyss: #111111;
  --sea: #000000;
  --foam: #ffffff;
  --mist: #999999;
  --coral: #66ffff;
  --coral-deep: #42a6a6;
  --ink: #111111;
  --glass: #1a1a1a;
  --hot: #ff2f3d;
  --mark-ink: #111111;
  --card-edge: #4c4c4c;
  --font-display: 'Audiowide', 'Arial Black', 'Trebuchet MS', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif;
  --font-body: 'Nunito', ui-rounded, 'SF Pro Rounded', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--sea);
  color: var(--foam);
  font-family: var(--font-body);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  overscroll-behavior: none;
}
body { position: fixed; inset: 0; }

#game {
  position: fixed;
  inset: 0;
  display: block;
  touch-action: none;
}

#safe {
  position: fixed;
  inset: 0;
  visibility: hidden;
  pointer-events: none;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
    env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}

[hidden] { display: none !important; }

.overlay {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  background: rgba(0, 0, 0, 0.5);

  animation: fade 0.25s ease-out;
}
.overlay.locked .card { pointer-events: none; }
#title { background: rgba(0, 0, 0, 0.55); }

}
.card--title { width: min(100%, 380px); }

h2 {
  margin: 0;

}

.logo {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;

  align-items: center;
  gap: 0.14em;
}
.logo span {
  display: inline-block;

  text-shadow: none;

}
.logo span:nth-child(2) { animation-delay: -0.3s; }

.tagline {
  margin: -6px 0 0;
  color: var(--mist);

  font-size: 1rem;
}

.actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.actions--stack { flex-direction: column; }
.actions .btn { flex: 1 1 140px; }
.actions--stack .btn { flex: none; }

.btn {
  appearance: none;
  border: 2px solid color-mix(in srgb, var(--foam) 30%, transparent);
  background: transparent;
  color: var(--btn-ink);
  font-family: var(--font-display);
  font-size: 1.05rem;
  letter-spacing: 0.02em;
  padding: 13px 20px;
  border-radius: 999px;

}
.btn:hover { background: color-mix(in srgb, var(--foam) 6%, transparent); }

.btn:focus-visible { outline: 3px solid var(--mist); outline-offset: 3px; }
.btn--primary {
  background: var(--coral);
  border-color: var(--coral);
  color: var(--ink);
  box-shadow: 0 4px 0 var(--coral-deep);
}

.btn--quiet { border-color: transparent; color: var(--btn-quiet-ink); font-size: 1rem; }

.howto {
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 8px;
  text-align: left;
  font-size: 0.9rem;

}
.howto li { padding-left: 18px; position: relative; }
.howto li::before {
  content: '';

  left: 2px; top: 0.45em;
  width: 8px; height: 8px;
  border-radius: 50%;

}

.stats {
  margin: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
/* The final score is the headline; best and biggest sit under it. */
.stats div:first-child { grid-column: 1 / -1; padding: 14px 8px 16px; }
.stats div:first-child dd { font-size: 2.6rem; }
.stats div {
  padding: 10px 4px;
  border-radius: 16px;
  background: color-mix(in srgb, var(--foam) 7%, transparent);

  font-weight: 800;
  letter-spacing: 0.06em;

}

  margin: 4px 0 0;

.btn--small {

  font-variant-numeric: tabular-nums;
}

.overlay--top { background: rgba(0, 0, 0, 0.7); }
.card--awards { width: min(100%, 400px); text-align: left; gap: 14px; }

.btn--icon {
  flex: none;
  width: 44px; height: 44px;
  padding: 0;
  font-family: var(--font-body);
  font-size: 1.7rem;
  line-height: 1;
}
.subhead {
  margin: 4px 0 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 1.3rem;
}
.awards {
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 6px;
}
.awards li {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 10px;
  align-items: center;
  padding: 8px 10px;
  border-radius: 14px;
  background: color-mix(in srgb, var(--foam) 5%, transparent);
}
.awards li .mark {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-size: 0.95rem;

  color: color-mix(in srgb, var(--foam) 40%, transparent);
}

.awards li span { display: block; font-size: 0.85rem; color: color-mix(in srgb, var(--foam) 70%, transparent); line-height: 1.3; }
.awards li:not(.done) b { color: color-mix(in srgb, var(--foam) 75%, transparent); }

.styles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.style-opt {
  appearance: none;
  display: grid;
  gap: 6px;
  padding: 10px;
  border-radius: 16px;
  border: 2px solid color-mix(in srgb, var(--foam) 15%, transparent);
  background: color-mix(in srgb, var(--foam) 5%, transparent);
  color: var(--foam);
  font: inherit;
  text-align: left;
  cursor: pointer;
  touch-action: manipulation;
}
.style-opt[aria-checked="true"] { border-color: var(--coral); background: color-mix(in srgb, var(--foam) 8%, transparent); }

.style-opt:focus-visible { outline: 3px solid var(--mist); outline-offset: 2px; }

.style-opt small { font-size: 0.75rem; color: var(--mist); font-weight: 800; }
.style-opt--locked .swatches { opacity: 0.8; }
.style-opt .swatches { background: var(--sw-bg); border: 2px solid var(--sw-edge); border-radius: 999px; padding: 4px; width: max-content; }
.styles-tokens { margin: -4px 0 4px; }
.swatches { display: flex; gap: 3px; }
.swatches i {
  width: 18px; height: 18px;
  border-radius: 50%;
  box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.2);
}

/* Toast */
.toast {
  position: fixed;
  left: 50%;
  top: 8px;
  transform: translateX(var(--toast-x, -50%));
  width: min(calc(100% - 32px), 360px);
  padding: 9px 14px;
  border-radius: 18px;
  background: color-mix(in srgb, var(--glass) 96%, transparent);
  border: 1.5px solid var(--coral);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
  display: grid;
  gap: 2px;
  text-align: center;
  pointer-events: none;
  z-index: 10;
  animation: toast-in 0.4s cubic-bezier(0.2, 1.4, 0.4, 1);
}
.toast--out { opacity: 0; transform: translate(var(--toast-x, -50%), -12px); transition: opacity 0.4s, transform 0.4s; }
.toast-kicker {
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--hot);
}
.toast b { font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; }
.toast span { font-size: 0.8rem; color: var(--mist); line-height: 1.3; }
.toast .toast-extra { color: var(--coral); font-weight: 800; }
@keyframes toast-in { from { opacity: 0; transform: translate(var(--toast-x, -50%), -20px); } }

/* Phones held sideways: the tall tank would be tiny, so ask to rotate. */
.rotate {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: none;
  place-content: center;
  justify-items: center;
  gap: 18px;

  font-family: var(--font-display);
  font-size: 1.4rem;
  padding: 16px;
}

  animation: turn 2s ease-in-out infinite;

@keyframes turn { 0%, 30% { transform: rotate(-90deg); } 60%, 100% { transform: rotate(0deg); } }
@media (orientation: landscape) and (max-height: 500px) and (pointer: coarse) {
  .rotate { display: grid; }
}

@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(16px) scale(0.97); } }
@keyframes bob {
  0%, 100% { transform: translateY(0) scale(1, 1); }
  45% { transform: translateY(-5px) scale(0.96, 1.05); }

}

  .logo span, .card, .overlay, .toast, .rotate-phone { animation: none; }
}

  </div>

  <script>
/*
 * Soft-body physics for Soboscuba, ported from the original sobosuba's
 * model (docs/original-spec.md, sections 2, 5, 6, 10 and 17).
 *
 * A sobo is a closed ring of small circles (subas, radius 12, mass 1)
 * plus a heavy invisible "mass ball" tied to the ring's centre by a
 * spring. Three forces hold it together every substep:
 *   - skin: neighbouring subas pulled together when stretched past 16 px,
 *   - area: every suba pushed along its outward normal in proportion to
 *     the missing area (internal gas pressure),
 *   - ball spring: the ball chases the ring centre and the ring feels the
 *     reaction, which is what gives a big sobo its weight.
 * Contacts are frictionless and inelastic, as in the original (Godot
 * combines friction with min(), and every suba has friction 0).
 *
 * Forces are integrated with semi-implicit Euler; contacts are resolved by
 * position projection and velocities are taken from the corrected motion.
 * World units are the original's px, origin at the field centre, y down.
 */
(function (SB) {
  'use strict';

  var SUBA_R = 12;
  var SPACING = SUBA_R * 2 * (1 - 0.333333);  // rest distance between neighbours
  var CONTACT = SUBA_R * 2;
  var CELL = CONTACT;

  var CFG = SB.PHYS = {
    tick: 1 / 60,
    substeps: 4,
    iterations: 2,
    gravity: 150,
    linearDamp: 0.2,
    skinFreq: 2300, skinDamp: 9, skinMax: 50000,
    areaForce: 0.75, areaMax: 8000,
    ballFreq: 200, ballDamp: 15,
    bumperR: 64, bumperMass: 10, bumperTravel: 32, bumperFreq: 5, bumperDamp: 7,
    shockSpeed: 2000, shockImpulse: 100,
    overlapAccel: 200, overlapTimeout: 3
  };
  SB.SUBA_R = SUBA_R;

  /* ---------- tier table (spec 5.1) ---------- */
  var TIERS = [];
  (function () {
    for (var n = 0; n < 20; n++) {
      var outerArea = Math.pow(1.26, n) * 3700;
      var innerR0 = Math.sqrt(outerArea / Math.PI) - SUBA_R;
      var circ = Math.round(2 * Math.PI * innerR0 / SPACING) * SPACING;
      var innerR = circ / (2 * Math.PI);
      var outerR = innerR + SUBA_R;
      var count = Math.round(circ / SPACING);
      var oArea = Math.PI * outerR * outerR;
      var mass = oArea / 350;
      TIERS.push({
        tier: n, value: Math.pow(2, n), count: count,
        innerR: innerR, outerR: outerR, innerArea: Math.PI * innerR * innerR, outerArea: oArea,
        totalMass: mass, ballMass: mass - count,
        flash: Math.log(100) * oArea / 60000
      });
    }
  })();
  SB.TIERS = TIERS;

  /* ---------- sobo ---------- */
  var nextId = 1;

  function Sobo(tier, cx, cy) {
    var d = TIERS[tier];
    this.id = nextId++;
    this.tier = tier;
    this.value = d.value;
    this.data = d;
    var n = this.n = d.count;
    this.x = new Float64Array(n); this.y = new Float64Array(n);
    this.vx = new Float64Array(n); this.vy = new Float64Array(n);
    this.px = new Float64Array(n); this.py = new Float64Array(n);
    this.nx = new Float64Array(n); this.ny = new Float64Array(n);
    this.ax = new Float64Array(n); this.ay = new Float64Array(n);
    this.wall = new Uint8Array(n);      // collides with the field walls
    this.entering = new Uint8Array(n);  // still crossing in from outside a wall
    this.ghost = null;                  // overlap recovery: {soboId: true} this ring ignores
    this.ghostSubas = null;             // Uint8Array, which subas the ghost applies to
    this.base = new Float64Array(n);    // rest angle of each suba
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2;
      this.base[i] = a;
      this.x[i] = cx + Math.cos(a) * d.innerR;
      this.y[i] = cy + Math.sin(a) * d.innerR;
      this.wall[i] = 1;
    }
    this.bx = cx; this.by = cy; this.bvx = 0; this.bvy = 0;
    this.cx = cx; this.cy = cy; this.avx = 0; this.avy = 0;
    this.area = d.innerArea;
    this.merged = false;       // made by a merge (counts for score)
    this.allowMerges = true;
    this.flash = 0; this.flashT = 0;
    this.onBar = false;        // float bar forces apply
    this.frozen = false;
    this.dead = false;
    this.touched = false;      // any external contact this tick
    this.labelAng = 0; this.labelVel = 0;
  }
  SB.Sobo = Sobo;

  Sobo.prototype.setVelocity = function (vx, vy) {
    for (var i = 0; i < this.n; i++) { this.vx[i] = vx; this.vy[i] = vy; }
    this.bvx = vx; this.bvy = vy;
  };
  Sobo.prototype.addVelocity = function (vx, vy) {
    for (var i = 0; i < this.n; i++) { this.vx[i] += vx; this.vy[i] += vy; }
    this.bvx += vx; this.bvy += vy;
  };
  Sobo.prototype.setWalls = function (on) {
    for (var i = 0; i < this.n; i++) this.wall[i] = on ? 1 : 0;
  };
  Sobo.prototype.measure = function () {
    var n = this.n, x = this.x, y = this.y, sx = 0, sy = 0, svx = 0, svy = 0, i;
    for (i = 0; i < n; i++) { sx += x[i]; sy += y[i]; svx += this.vx[i]; svy += this.vy[i]; }
    this.cx = sx / n; this.cy = sy / n; this.avx = svx / n; this.avy = svy / n;
    // Signed area (positive for the ring's winding) and outward normals.
    var area = 0, j = n - 1;
    for (i = 0; i < n; i++) { area += x[j] * y[i] - y[j] * x[i]; j = i; }
    this.area = area / 2;
    var p = n - 1, e0x = x[0] - x[p], e0y = y[0] - y[p];
    var l0 = Math.hypot(e0x, e0y) || 1; e0x /= l0; e0y /= l0;
    for (i = 0; i < n; i++) {
      var k = i + 1 === n ? 0 : i + 1;
      var e1x = x[k] - x[i], e1y = y[k] - y[i];
      var l1 = Math.hypot(e1x, e1y) || 1; e1x /= l1; e1y /= l1;
      // Edge normal = edge direction turned -90 degrees; average the two.
      var nx = e0y + e1y, ny = -e0x - e1x, nl = Math.hypot(nx, ny);
      if (nl < 1e-9) { nx = e1y; ny = -e1x; nl = 1; }
      this.nx[i] = nx / nl; this.ny[i] = ny / nl;
      e0x = e1x; e0y = e1y;
    }
  };
  /* Point inside the ring polygon through the suba centres (pad grows it). */
  Sobo.prototype.contains = function (px, py, pad) {
    var x = this.x, y = this.y, n = this.n, inside = false, j = n - 1;
    pad = pad || 0;

    // 在候选模式上完整校验：不破坏当前局面、不删除存档。
    var candidate = new SB.Classic(data.layout, hooks);
    if (!candidate.restore(data)) return false;   // 存档损坏：保留存档、由 UI 提示
    // 成就追踪器同样先在候选模式上、用临时 Tracker 完整验证，不改动全局 tracker。
    var probe = new SB.Achievements.Tracker(function () {});
    if (!probe.restore(data.tracker, candidate.allSobos())) return false;
    // 模式与追踪器都合法：一次性切换并提交。
    mode = candidate;
    tracker.restore(data.tracker, mode.allSobos());
    R.resize(window.innerWidth, window.innerHeight, dpr(), insets(), candidate.layoutName);
    R.fit(candidate);
    R.gains.length = 0;
    R.shownScore = candidate.score;
    R.snap();
    app.saveT = 0;
    setScreen('play');
    return true;
  }

  /* ---------- menus ---------- */
  var overlays = { title: $('title'), paused: $('pause'), over: $('over') };
  function setScreen(s) {
    app.screen = s;
    overlays.title.hidden = s !== 'title';
    overlays.paused.hidden = s !== 'paused';
    overlays.over.hidden = s !== 'over';
    if (s === 'title') {
      $('btn-continue').hidden = !store.get('game', null);
      $('btn-play').textContent = $('btn-continue').hidden ? '开始游戏' : '新游戏';
      $('title-best').textContent = String(best);
      $('awards-count').textContent = achCount() + '/' + A_DEFS.length;
    }
    if (mode && s !== 'play') mode.cancelAim(true);
  }
  function pause() {
    if (app.screen !== 'play' || !mode || mode.state !== 'playing') return;
    setScreen('paused');
    save();
  }
  // Shrinks a number until it fits its box, so long scores never wrap.
  function setFit(el, text) {
    if (el.textContent === text && el.dataset.fit) return;
    el.textContent = text;
    el.style.fontSize = '';
    var avail = el.parentElement.clientWidth - 8, w = el.scrollWidth;
    if (w > avail) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * avail / w) + 'px';
    el.dataset.fit = '1';
  }
  function showOver() {
    app.overScore = 0;
    $('over-newbest').hidden = !app.newBest || mode.score === 0;
    setScreen('over');
    setFit($('over-score'), '0');
    setFit($('over-best'), String(best));
    setFit($('over-biggest'), String(mode.biggest));
    R.whiteFlash = 1;
  }

  function bind(id, fn) {
    $(id).addEventListener('click', function () { Audio.unlock(); Audio.click(); fn(); });
  }
  function syncToggles() {
    $('btn-sound').textContent = Audio.isMuted() ? '音效：关' : '音效：开';
    $('btn-haptics').textContent = hapticsOn ? '震动：开' : '震动：关';
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function openAwards() {
    var list = $('awards-list');
    list.textContent = '';
    A_DEFS.forEach(function (a) {
      var li = el('li', achieved[a.id] ? 'done' : '');
      li.appendChild(el('span', 'mark', achieved[a.id] ? '✓' : '?'));
      var txt = el('div');
      txt.appendChild(el('b', null, a.name));
      txt.appendChild(el('span', null, a.desc));
      li.appendChild(txt);
      list.appendChild(li);
    });
    $('awards-progress').textContent = '已解锁 ' + achCount() + ' / ' + A_DEFS.length;
    renderStyles();
    var ov = $('awards');
    ov.hidden = false;
    ov.scrollTop = 0;
    $('btn-awards-close').focus({ preventScroll: true });
  }
  function renderStyles() {
    var t = tokens();
    $('styles-tokens').textContent = '剩余 ' + t + ' 次主题解锁';
    var box = $('styles-list');
    box.textContent = '';
    SB.STYLES.forEach(function (s) {
      var open = styleOpen(s.id);
      var b = el('button', 'style-opt' + (open ? '' : ' style-opt--locked'));
      b.type = 'button';
      b.id = 'style-' + s.id;
      b.setAttribute('role', 'radio');
      b.setAttribute('aria-checked', String(styleId === s.id));
      b.disabled = !open && t <= 0;
      b.style.setProperty('--sw-bg', s.bg);
      b.style.setProperty('--sw-edge', s.structure);
      var sw = el('span', 'swatches');
      [0, 1, 2, 3, 4, 5].forEach(function (k) {
        var i = el('i');
        i.style.background = s.palette[k % s.palette.length];
        sw.appendChild(i);
      });
      b.appendChild(sw);
      b.appendChild(el('b', null, s.name));
      if (!open) b.appendChild(el('small', null, t > 0 ? '点击解锁' : '未解锁'));
      b.addEventListener('click', function () {
        if (!setStyle(s.id)) return;
        Audio.click();
        renderStyles();
        $('style-' + s.id).focus({ preventScroll: true });
      });
      box.appendChild(b);
    });
  }
  function closeAwards() {
    $('awards').hidden = true;
    if (app.screen === 'title') $('awards-count').textContent = achCount() + '/' + A_DEFS.length;
  }

  bind('btn-play', newGame);
  bind('btn-continue', function () {
    if (!resume()) window.alert('存档已损坏或与当前版本不兼容，无法继续。\n原存档未被删除；你可以直接开始新游戏。');
  });
  bind('btn-resume', function () { setScreen('play'); });
  bind('btn-restart', newGame);
  bind('btn-home', function () { save(); attract(); setScreen('title'); });
  bind('btn-again', newGame);
  bind('btn-view', function () { setScreen('view'); });
  bind('btn-over-home', function () { attract(); setScreen('title'); });
  bind('btn-haptics', function () {
    hapticsOn = !hapticsOn;
    store.set('haptics', hapticsOn);
    syncToggles();
    haptic(0.5);
  });
  bind('btn-sound', function () {
    Audio.setMuted(!Audio.isMuted());
    store.set('muted', Audio.isMuted());
    syncToggles();
  });
  bind('btn-awards', openAwards);
  bind('btn-awards-pause', openAwards);
  bind('btn-awards-close', closeAwards);
  bind('btn-awards-x', closeAwards);
  syncToggles();

  var sideways = window.matchMedia('(orientation: landscape) and (max-height: 500px) and (pointer: coarse)');
  function onSideways() { if (sideways.matches) pause(); }
  if (sideways.addEventListener) sideways.addEventListener('change', onSideways);
  else if (sideways.addListener) sideways.addListener(onSideways);
  document.addEventListener('visibilitychange', function () { if (document.hidden) { pause(); save(); } });
  window.addEventListener('pagehide', save);

  /* ---------- view ---------- */
  var safeEl = $('safe');
  function dpr() { return Math.min(window.devicePixelRatio || 1, 2); }
  function insets() {
    var cs = getComputedStyle(safeEl);
    return [parseFloat(cs.paddingTop) || 0, parseFloat(cs.paddingRight) || 0, parseFloat(cs.paddingBottom) || 0, parseFloat(cs.paddingLeft) || 0];
  }
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    // A new layout only takes over between games; a running game keeps its own.
    if (mode && app.screen === 'title' && mode.layoutName !== layoutFor() && !mode.world.sobos.some(function (s) { return s.merged; })) attract();
    R.resize(w, h, dpr(), insets(), mode ? mode.layoutName : layoutFor());
    if (mode) R.fit(mode);
    if (!$('toast').hidden) placeToast();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 200); });

  /* ---------- input ---------- */
  var activePointer = null;
  function inMenuButton(e) {
    var b = R.menuButton();
    return e.clientX >= b.x && e.clientX <= b.x + b.w && e.clientY >= b.y && e.clientY <= b.y + b.h;
  }
  function worldAt(e) { return R.toWorld(e.clientX, e.clientY); }
  function deviceOf(e) { return e.pointerType === 'mouse' ? 'mouse' : 'touch'; }

  canvas.addEventListener('pointerdown', function (e) {
    Audio.unlock();
    app.device = deviceOf(e);
    if (app.screen === 'view') { setScreen('over'); return; }
    if (app.screen !== 'play' || !mode) return;
    if (e.button === 2) return;
    if (inMenuButton(e) && !mode.aim) { Audio.click(); pause(); return; }
    if (activePointer !== null) return;
    var p = worldAt(e);
    if (mode.pointerDown(p.x, p.y, app.device)) {
      activePointer = e.pointerId;
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!mode || app.screen !== 'play') return;
    if (activePointer !== null && e.pointerId !== activePointer) return;
    // A right press while the left button aims arrives as a chorded
    // pointermove, never a pointerdown.
    if (e.button === 2 && (e.buttons & 2)) { mode.cancelAim(); return; }
    if (e.pointerType === 'mouse') app.device = 'mouse';
    var p = worldAt(e);
    mode.pointerMove(p.x, p.y, deviceOf(e));
    canvas.style.cursor = inMenuButton(e) ? 'pointer' : '';
  });
  canvas.addEventListener('pointerup', function (e) {
    if (e.pointerId !== activePointer) return;
    activePointer = null;
    if (mode && app.screen === 'play') mode.pointerUp();
  });
  canvas.addEventListener('pointercancel', function (e) {
    if (e.pointerId !== activePointer) return;
    activePointer = null;
    if (mode) mode.cancelAim(true);
  });
  canvas.addEventListener('pointerleave', function (e) {
    if (e.pointerType === 'mouse' && mode && activePointer === null) mode.pointer = null;
  });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  // 窗口失焦（Alt+Tab、点到其他应用等；最小化另有 visibilitychange 处理）时，
  // 取消可能正在进行的拖拽并暂停。失焦可能使 pointerup 丢失，若不清 activePointer，
  // 回到窗口后第一次 pointerdown 会被“已有手势”拦截而无法操作；暂停后由玩家手动
  // 继续，避免切回瞬间误发射。
  window.addEventListener('blur', function () {
    if (activePointer !== null) {
      activePointer = null;
      if (mode) mode.cancelAim(true);
    }
    pause();
  });

  window.addEventListener('keydown', function (e) {
    var modal = !$('awards').hidden;   // 模态弹窗（成就与主题）是否打开
    if (e.key === 'Escape') {
      // 弹窗打开时，Escape 只关闭弹窗，保留打开前的 screen（暂停/标题），不改变暂停状态。
      if (modal) { closeAwards(); return; }
      if (app.screen === 'play') pause();
      else if (app.screen === 'paused') setScreen('play');
      else if (app.screen === 'view') setScreen('over');
      return;
    }
    if (e.key === 'p' || e.key === 'P') {
      // 弹窗打开时，P/p 绝不穿透成就页改变暂停状态；普通暂停页照常恢复。
      if (modal) return;
      if (app.screen === 'play') pause();
      else if (app.screen === 'paused') setScreen('play');
      return;
    }
    if (e.key === 'm' || e.key === 'M') { Audio.setMuted(!Audio.isMuted()); store.set('muted', Audio.isMuted()); syncToggles(); return; }
    if (e.key === 'k' || e.key === 'K') { cycleStyle(); if (modal) renderStyles(); return; }
    if (e.key === 'l' || e.key === 'L') { setStyle(styleId === LIGHT_STYLE ? DEFAULT_STYLE : LIGHT_STYLE); if (modal) renderStyles(); }
  });

  /* ---------- loop ---------- */
  function tick() {
    if (!mode) return;
    var playing = app.screen === 'play' || app.screen === 'title';
    if (!playing || mode.state !== 'playing') return;
    mode.tick();
    if (app.screen !== 'play') return;
    tracker.tick(mode, TICK);
    var a = mode.aim;
    if (a) {
      var m = a.sobo.data.totalMass, len = Math.hypot(a.vx, a.vy);
      if (len > 0) R.push(-a.vx / len * m, -a.vy / len * m, a.sobo.cx, a.sobo.cy);
      var px = len * 220;
      R.vibrate(px * 0.02 * TICK);
      if (Math.abs(px - lastArrow) > 10) { lastArrow = px; Audio.bump(0.4 + len); haptic(len * 0.3); }
    }
    if (mode.sides[0].holding || mode.sides[1].holding) {
      app.dangerT -= TICK;
      if (app.dangerT <= 0) { app.dangerT = 0.3; Audio.warn(); haptic(0.1); }
    } else app.dangerT = 0;
    app.saveT += TICK;
    if (app.saveT >= SAVE_EVERY) { app.saveT = 0; save(); }
  }

  var last = 0, acc = 0;
  function frame(ts) {
    requestAnimationFrame(frame);
    var t = ts / 1000;
    if (!last) last = t;
    var dt = Math.min(0.1, t - last);
    last = t;
    acc += dt;
    var steps = 0;
    while (acc >= TICK && steps < 4) { tick(); acc -= TICK; steps++; }
    if (steps >= 4) acc = 0;
    if (mode && (app.screen === 'play' || app.screen === 'title')) mode.frame(dt);
    R.update(dt, app.screen === 'paused');
    if (app.screen === 'over') {
      app.overScore += (mode.score - app.overScore) * Math.min(1, 2 * dt);
      if (mode.score - app.overScore < 0.5) app.overScore = mode.score;
      setFit($('over-score'), String(Math.round(app.overScore)));
    }
    var inGame = app.screen !== 'title';
    R.draw(mode, st, {
      dt: dt,
      device: app.device,
      inGame: inGame,
      menuIcon: app.screen === 'play',
      hidePanels: app.screen === 'over',
      instructions: app.screen === 'play' && mode && mode.state === 'playing' && taught[app.device] < TEACH_LAUNCHES,
      sideTitle: app.screen === 'over' || app.screen === 'view' || (mode && mode.state !== 'playing' && inGame) ? '游戏结束' : '凝合'
    });
  }

  resize();
  attract();
  setScreen('title');
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.load) {
    document.fonts.load('15px "Souba Score"').catch(function () {});
    document.fonts.load('22px "Souba Text"').catch(function () {});
  }

  // Hooks for automated tests.
  SB.game = {
    app: app, renderer: R, store: store, unlock: unlock, achieved: achieved, setStyle: setStyle,
    newGame: newGame, resume: resume, save: save, pause: pause,
    get mode() { return mode; }, get style() { return styleId; }, tokens: tokens
  };

  // 桌面外壳握手：主进程在关窗前请求“暂停并保存”，页面返回真实写入结果。
  // 仅在桌面 preload 注入了 ningheDesktop 时注册，网页版没有此对象，行为不变。
  if (window.ningheDesktop && typeof window.ningheDesktop.setSaveHandler === 'function') {
    window.ningheDesktop.setSaveHandler(function () {
      if (app.screen === 'play') {
        setScreen('paused');
        if (mode) mode.cancelAim(true);
      }
      return { ok: save() };
    });
  }
})(window.SB = window.SB || {});

</script>
</body>
</html>
